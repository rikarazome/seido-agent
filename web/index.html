<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>制度エージェント — 東京23区</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230017C1'/%3E%3Ctext x='16' y='23' font-size='18' font-weight='bold' fill='white' text-anchor='middle' font-family='sans-serif'%3E%C2%A5%3C/text%3E%3C/svg%3E">
<style>
:root{
  --blue-900:#000082; --blue-700:#0017C1; --blue-100:#C5D7FB; --blue-50:#E8F1FE;
  --ink:#1A1A1C; --ink-sub:#626264; --ink-faint:#949497;
  --border:#D8D8DB; --bg:#F1F1F4; --surface:#FFFFFF;
  --green-700:#197A4B; --green-50:#E6F5EC;
  --amber-800:#927200; --amber-50:#FBF5E0;
  --red-700:#EC0000; --red-50:#FDEEEE;
  --focus:#FFD43D;
  --r-s:8px; --r-m:12px; --r-pill:999px;
  --shadow:0 1px 3px rgba(26,26,28,.10), 0 1px 2px rgba(26,26,28,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;height:100%}
body{
  font-family:"Noto Sans JP","Hiragino Sans",-apple-system,"Segoe UI",sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.7;
  font-feature-settings:"palt";height:100%;display:flex;flex-direction:column;
}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
button{cursor:pointer;border:none;font-family:inherit;font-weight:700}

/* ---- header ---- */
.appbar{background:var(--surface);border-bottom:2px solid var(--blue-700);flex:none}
.appbar-inner{max-width:680px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{flex:none;width:36px;height:36px;border-radius:10px;background:var(--blue-700);
  color:#fff;display:grid;place-items:center;font-weight:700;font-size:1.1rem}
.appbar h1{font-size:1rem;line-height:1.3;font-weight:700}
.appbar .muni-sel{margin-left:auto;font-size:.82rem;padding:4px 8px;border:1px solid var(--border);
  border-radius:var(--r-s);background:var(--surface);font-family:inherit}

/* ---- chat area ---- */
.chat-wrap{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.chat{max-width:680px;margin:0 auto;padding:12px 16px 80px}

/* ---- bubbles ---- */
.msg{margin:10px 0;display:flex;gap:10px;align-items:flex-start}
.msg.agent{flex-direction:row}
.msg.user{flex-direction:row-reverse}
.msg .avatar{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  font-size:.75rem;font-weight:700;color:#fff}
.msg.agent .avatar{background:var(--blue-700)}
.msg.user .avatar{background:var(--ink-sub)}
.bubble{max-width:85%;padding:12px 16px;border-radius:var(--r-m);font-size:.92rem;line-height:1.6}
.msg.agent .bubble{background:var(--surface);border:1px solid var(--border);border-top-left-radius:4px}
.msg.user .bubble{background:var(--blue-700);color:#fff;border-top-right-radius:4px}

/* ---- chips inside chat ---- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{background:var(--surface);color:var(--blue-700);border:1.5px solid var(--blue-700);
  padding:9px 16px;border-radius:var(--r-pill);font-size:.88rem;transition:background .12s}
.chip:hover{background:var(--blue-50)}
.chip:active{background:var(--blue-100)}
.chip.dim{color:var(--ink-sub);border-color:var(--border);font-weight:600}
.chip.dim:hover{background:var(--bg)}
.chip-row-num{display:flex;gap:8px;margin-top:10px;align-items:center}
.chip-row-num input{width:160px;padding:9px 12px;border:1px solid var(--ink-faint);
  border-radius:var(--r-pill);font-size:.92rem;font-family:inherit}
.chip-row-num button{padding:9px 16px}

/* ---- result card (embedded in chat) ---- */
.result-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);
  padding:16px;margin:10px 0;box-shadow:var(--shadow);max-width:680px}
.hero-inline{background:linear-gradient(135deg,var(--blue-700),#1438D8 60%,#2E50E0);
  color:#fff;border-radius:var(--r-m);padding:18px 16px;margin-bottom:12px}
.hero-inline .cap{font-size:.78rem;font-weight:600;opacity:.9;letter-spacing:.04em}
.hero-inline .amounts{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:baseline;margin-top:2px}
.hero-inline .unit{font-size:.82rem;font-weight:600;opacity:.92}
.hero-inline .yen{font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.hero-inline .none{font-size:.9rem;font-weight:600;margin-top:2px}
.progress{display:flex;align-items:center;gap:10px;margin-top:10px}
.progress .bar{flex:1;height:6px;background:rgba(255,255,255,.25);border-radius:var(--r-pill);overflow:hidden}
.progress .bar i{display:block;height:100%;background:#fff;border-radius:var(--r-pill);transition:width .4s}
.progress .num{font-size:.72rem;font-weight:700;font-variant-numeric:tabular-nums}

/* ---- program rows ---- */
.prog-section{margin-top:8px}
.prog-section summary{font-size:.82rem;font-weight:700;color:var(--ink-sub);cursor:pointer;padding:4px 0}
.prow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bg);font-size:.86rem}
.prow:last-child{border-bottom:none}
.prow .pname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{flex:none;font-size:.68rem;font-weight:700;border-radius:var(--r-pill);padding:1px 10px;letter-spacing:.03em}
.badge.decided{background:var(--green-50);color:var(--green-700)}
.badge.blocked{background:var(--amber-50);color:var(--amber-800)}
.badge.ineligible{background:var(--bg);color:var(--ink-faint)}
.badge.error{background:var(--red-50);color:var(--red-700)}
.prow .pamount{flex:none;font-weight:700;color:var(--green-700);font-size:.84rem;font-variant-numeric:tabular-nums}
.prow.ineligible .pname{color:var(--ink-faint)}
.prow-detail{border-bottom:1px solid var(--bg);padding-bottom:4px}
.prow-detail:last-child{border-bottom:none}
.proof-btn{background:none;color:var(--blue-700);font-size:.78rem;text-decoration:underline;
  text-underline-offset:3px;padding:2px 4px;font-weight:600}
.reason-box{background:#F7F9FC;border:1px solid var(--blue-100);border-radius:var(--r-s);
  padding:12px 14px;margin:6px 0}
.reason-ja{font-size:.84rem;line-height:1.7;margin-bottom:8px}
.reason-ja ul{margin:4px 0 4px 18px;list-style:disc}
.reason-ja li{margin:2px 0}
.reason-statute{font-size:.78rem;color:var(--ink-sub);margin-top:6px}
.reason-statute a{color:var(--blue-700);text-decoration:underline;text-underline-offset:2px}
.proof{font-size:.8rem;background:#F7F9FC;border:1px solid var(--blue-100);
  border-radius:var(--r-s);padding:10px 12px;margin:6px 0;overflow-x:auto}
.proof .proof-title{font-size:.72rem;font-weight:700;color:var(--blue-700);letter-spacing:.05em;margin-bottom:4px}
.proof ul{margin-left:14px;list-style:none;border-left:2px solid var(--blue-100);padding-left:8px}
.proof>ul{margin-left:0;border-left:none;padding-left:0}
.proof li{margin:2px 0}
.proof code{font-family:"Consolas","SF Mono",monospace;font-size:.86em;background:rgba(0,23,193,.06);
  border-radius:4px;padding:0 4px}
.naf{color:var(--red-700)}
.naf::before{content:"OK ";font-weight:700}

/* ---- footer / disclaimer ---- */
.disclaimer{flex:none;background:var(--amber-50);border-top:1px solid #E8D58A;padding:8px 16px;
  font-size:.72rem;color:var(--amber-800);text-align:center}

/* ---- input bar ---- */
.input-bar{flex:none;background:var(--surface);border-top:1px solid var(--border);padding:10px 16px}
.input-inner{max-width:680px;margin:0 auto;display:flex;gap:8px;align-items:center}
.input-inner input{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:var(--r-pill);
  font-size:.92rem;font-family:inherit}
.input-inner button{padding:10px 20px;background:var(--blue-700);color:#fff;border-radius:var(--r-pill);
  font-size:.92rem}
.input-inner button:disabled{opacity:.4}
.input-note{max-width:680px;margin:4px auto 0;font-size:.7rem;color:var(--ink-faint);text-align:center}

.hidden{display:none}
@media(max-width:480px){
  .chat{padding:8px 10px 80px}
  .hero-inline .yen{font-size:1.3rem}
  .bubble{max-width:92%}
}
</style>
</head>
<body>
<header class="appbar">
  <div class="appbar-inner">
    <div class="logo">&#165;</div>
    <h1>制度エージェント</h1>
    <select class="muni-sel" id="municipality" onchange="onMuniChange()">
      <option value="shibuya">東京都渋谷区</option>
    </select>
  </div>
</header>

<div class="chat-wrap" id="chat-wrap">
  <div class="chat" id="chat"></div>
</div>

<div class="disclaimer">
  本サービスの判定は法的助言ではありません。最終的な判断は必ず自治体窓口でご確認ください。入力情報はサーバーに保存されません。
</div>

<div class="input-bar">
  <div class="input-inner">
    <input type="text" id="user-input" placeholder="自由に入力（Gemini連携で近日対応）" disabled>
    <button id="send-btn" disabled>送信</button>
  </div>
  <div class="input-note">現在は選択肢チップからお選びください</div>
</div>

<script>
"use strict";
function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML;}

let facts={children:[],askable:{}};
let lastResp=null;
let municipality="shibuya";
let phase="init"; // init -> profile -> judging -> done

const FACT_JA={
  hitorioya:"ひとり親かどうか",hitorioya_jiyuu:"ひとり親の事由",
  seikei_douitsu_partner:"事実婚の有無",fuyou_ninzu:"扶養人数",
  income:"年収",income_exact:"正確な所得",kenkou_hoken:"健康保険",
  koukou_zaigaku:"高校在学",gakkou_kubun:"学校区分",
  ninshin:"妊娠中かどうか",seikatsu_hogo:"生活保護の受給",
  hikazei:"住民税非課税",shogai_techo:"障害者手帳",
  shogai_teido:"障害の程度",kaigo_nintei:"介護認定",
  koyou_hoken:"雇用保険",rishoku:"離職中かどうか",
  rishoku_jiyuu:"離職の理由",nanbyo_nintei:"難病認定",
  jido_yougo_shisetsu:"児童養護施設入所",
  shogai_techo_child:"お子さんの障害者手帳",
  juutaku_type:"住宅の種類",shussan_yoteibi:"出産予定日",
  hoken_shubetsu:"健康保険の種類",byouki_kyugyou:"病気・ケガでの休業",
  kaigo_family:"介護休業中かどうか",daigaku_zaigaku:"大学等在学中かどうか",
  kaigo_nintei:"介護認定の有無",jiei_gyou:"自営業かどうか",
  taisyoku_kin:"退職金の受取",saigai_higai:"災害・盗難の被害",
  juutaku_kaishu:"住宅改修の実施",haiguusha_shibou:"配偶者との死別",
  jutaku_shinchiku:"住宅の新築・購入・リフォーム",
  rousai:"労災（業務上の事故・疾病）",
  ikuji_kyuugyou:"育児休業中かどうか",
  sai_shushoku_teate_jukyuu:"再就職手当の受給",
  tokutei_shishutsu_ari:"特定支出の有無",haiguusha:"配偶者の有無",
  jutaku_loan:"住宅ローンの有無",iryouhi_10man:"医療費10万円超",
  seimei_hoken:"生命保険の加入",jishin_hoken:"地震保険の加入"
};
const REASON_JA={
  "child past FY-end age 18":"18歳の年度末を過ぎています",
  "past FY-end age 18":"18歳の年度末を過ぎています",
  "no single-parent cause (Art.4(1))":"ひとり親要件（法4条1項）に該当しません",
  "no single-parent cause":"ひとり親要件に該当しません",
  "child shares livelihood with parent de-facto spouse (Art.4(2) analog)":"事実上の配偶者と生計同一のため対象外",
  "de-facto marriage (ordinance exclusion)":"事実婚のため対象外",
  "income exceeds partial-payment limit":"所得が一部支給の限度額を超えています",
  "income exceeds limit":"所得が限度額を超えています",
  "not high-school age (FY-end 16-18)":"高校生年代ではありません",
  "not enrolled in an eligible high school":"対象となる高校に在学していません",
  "not covered by public health insurance":"健康保険に未加入のため対象外",
  "past the 1st-birthday support window":"1歳バースデーサポート対象期間外",
  "grant for children born FY2026+ not yet announced (as of 2026-06)":"2026年度生まれの支給額は未発表",
  "born before FY2023 (program start)":"事業開始前の生まれのため対象外",
  "no_eligible_subject":"対象となる方がいません",
  "not_pregnant":"妊娠中ではないため対象外",
  "receiving_seikatsu_hogo":"生活保護受給中のため対象外",
  "in_jido_yougo_shisetsu":"児童養護施設入所中のため対象外",
  "no_shogai_techo":"障害者手帳を持っていないため対象外",
  "no_nanbyo_nintei":"難病認定を受けていないため対象外",
};
const BADGE_JA={decided:"受給見込み",blocked:"あと少し",ineligible:"対象外",
  error:"要窓口確認",unsupported:"判定準備中"};
const ja=r=>REASON_JA[r]||r;

// ---- municipalities ----
async function loadMunicipalities(){
  try{
    const r=await fetch("/api/municipalities");
    if(!r.ok)return;
    const munis=(await r.json()).municipalities;
    const sel=document.getElementById("municipality");
    sel.innerHTML=munis.map(m=>
      `<option value="${esc(m.id)}"${m.id==="shibuya"?" selected":""}>${esc(m.name)}</option>`).join("");
  }catch(e){}
}
loadMunicipalities();
function onMuniChange(){
  municipality=document.getElementById("municipality").value;
  if(phase==="judging"||phase==="done"){doJudge();}
}

// ---- chat rendering ----
function scrollBottom(){
  const w=document.getElementById("chat-wrap");
  setTimeout(()=>{w.scrollTop=w.scrollHeight;},50);
}

function addAgent(html){
  const d=document.createElement("div");
  d.className="msg agent";
  d.innerHTML=`<div class="avatar">A</div><div class="bubble">${html}</div>`;
  document.getElementById("chat").appendChild(d);
  scrollBottom();
}
function addUser(text){
  const d=document.createElement("div");
  d.className="msg user";
  d.innerHTML=`<div class="avatar">U</div><div class="bubble">${esc(text)}</div>`;
  document.getElementById("chat").appendChild(d);
  scrollBottom();
}
function addCard(html){
  const d=document.createElement("div");
  d.className="result-card";
  d.id="result-card";
  document.getElementById("chat").appendChild(d);
  d.innerHTML=html;
  scrollBottom();
}
function removeOldChips(){
  document.querySelectorAll("#chat .live-chips").forEach(el=>el.remove());
}
function addChips(html){
  removeOldChips();
  const d=document.createElement("div");
  d.className="live-chips";
  d.innerHTML=html;
  document.getElementById("chat").appendChild(d);
  scrollBottom();
}

// ---- profile collection (chat-style) ----
function startChat(){
  addAgent("はじめまして！あなたが受け取れる可能性のある給付金を、根拠つきで全部お調べします。<br><br>まず、いくつか教えてください。<br><br><b>お住まいの区を選んでください。</b>（ヘッダーで変更できます）");
  askBirthDate();
}

function askBirthDate(){
  addAgent("<b>あなたの生年月日を教えてください。</b><br><span style='font-size:.82rem;color:var(--ink-sub)'>年齢に応じた制度の判定に使います。</span>");
  addChips(`<div class="chips live-chips"><input type="date" id="bd-input" max="2026-12-31" style="border-radius:var(--r-pill);padding:9px 14px;border:1px solid var(--ink-faint);font-size:.92rem;font-family:inherit;width:200px"><button class="chip" onclick="submitBirthDate()">決定</button><button class="chip dim" onclick="skipBirthDate()">スキップ</button></div>`);
}
function submitBirthDate(){
  const v=document.getElementById("bd-input").value;
  if(!v){skipBirthDate();return;}
  addUser(v);
  removeOldChips();
  facts.claimant={birth_date:v};
  askChildren();
}
function skipBirthDate(){
  addUser("スキップ");
  removeOldChips();
  askChildren();
}

function askChildren(){
  addAgent("<b>お子さんはいらっしゃいますか？</b>");
  addChips(`<div class="chips live-chips"><button class="chip" onclick="answerHasChildren(true)">はい</button><button class="chip" onclick="answerHasChildren(false)">いいえ</button></div>`);
}
function answerHasChildren(yes){
  addUser(yes?"はい":"いいえ");
  removeOldChips();
  if(yes){askChildBirthDates();}
  else{facts.children=[];askIncome();}
}

let tempChildren=[];
function askChildBirthDates(){
  tempChildren=[];
  addAgent("<b>お子さんの生年月日を入力してください。</b><br><span style='font-size:.82rem;color:var(--ink-sub)'>複数いる場合は1人ずつ追加できます。</span>");
  showChildInput();
}
function showChildInput(){
  const n=tempChildren.length+1;
  addChips(`<div class="chips live-chips" style="flex-direction:column;gap:6px">
    <div style="display:flex;gap:8px;align-items:center">
      <span style="font-size:.82rem;font-weight:700;color:var(--ink-sub)">${n}人目</span>
      <input type="date" id="child-bd" max="2026-12-31" style="border-radius:var(--r-pill);padding:9px 14px;border:1px solid var(--ink-faint);font-size:.92rem;font-family:inherit;width:200px">
      <button class="chip" onclick="addChildDate()">追加</button>
    </div>
    ${tempChildren.length>0?'<button class="chip dim" onclick="doneChildren()">これで全員です</button>':''}
  </div>`);
}
function addChildDate(){
  const v=document.getElementById("child-bd").value;
  if(!v)return;
  tempChildren.push(v);
  addUser(`${tempChildren.length}人目: ${v}`);
  removeOldChips();
  showChildInput();
}
function doneChildren(){
  removeOldChips();
  facts.children=tempChildren.map((bd,i)=>({id:"c"+(i+1),birth_date:bd,askable:{}}));
  addUser(`お子さん ${tempChildren.length}人`);
  askIncome();
}

function askIncome(){
  addAgent("<b>昨年の世帯主の年収はどのくらいですか？</b><br><span style='font-size:.82rem;color:var(--ink-sub)'>額面・だいたいでOKです。</span>");
  addChips(`<div class="chips live-chips">
    <button class="chip" onclick="answerIncome([0,2000000])">200万円未満</button>
    <button class="chip" onclick="answerIncome([2000000,4000000])">200〜400万円</button>
    <button class="chip" onclick="answerIncome([4000000,6000000])">400〜600万円</button>
    <button class="chip" onclick="answerIncome([6000000,10000000])">600万〜1,000万円</button>
    <button class="chip" onclick="answerIncome([10000000,999999999])">1,000万円以上</button>
    <button class="chip dim" onclick="answerIncome(null)">わからない</button>
  </div>`);
}
function answerIncome(v){
  if(v){
    const labels={"0,2000000":"200万円未満","2000000,4000000":"200〜400万円","4000000,6000000":"400〜600万円","6000000,10000000":"600万〜1,000万円","10000000,999999999":"1,000万円以上"};
    addUser(labels[v.join(",")]||v.join("〜"));
  }else{addUser("わからない");}
  removeOldChips();
  facts.askable.nenshu=v;
  phase="judging";
  addAgent("ありがとうございます。判定しています...");
  doJudge();
}

// ---- judge ----
function yen(n){return n.toLocaleString("ja-JP")+"円";}
function amountText(a){
  if(!a)return"";
  if(a.type==="in_kind")return"医療費助成";
  const unit={monthly:"月",oneoff:"一時金 ",yearly:"年"}[a.type]||"";
  if(a.yen_min!=null)return`${unit}${yen(a.yen_min)}〜${yen(a.yen_max)}`;
  return`${unit}${yen(a.yen)}`;
}

async function doJudge(){
  const r=await fetch("/api/judge",{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({facts,municipality})});
  if(!r.ok){addAgent("判定中にエラーが発生しました。");return;}
  lastResp=await r.json();
  renderResult();
  renderNextQuestion();
}

function renderResult(){
  const old=document.getElementById("result-card");
  if(old)old.remove();

  const h=lastResp.headline;
  let parts=[];
  if(h.monthly_yen)parts.push(`<span><span class="unit">月</span> <span class="yen">${yen(h.monthly_yen)}</span></span>`);
  if(h.oneoff_yen)parts.push(`<span><span class="unit">一時金</span> <span class="yen">${yen(h.oneoff_yen)}</span></span>`);
  if(h.yearly_yen)parts.push(`<span><span class="unit">年</span> <span class="yen">${yen(h.yearly_yen)}</span></span>`);
  if(h.in_kind_count){
    const ikNames=lastResp.results.filter(r=>r.status==="decided"&&r.amount&&r.amount.type==="in_kind").map(r=>r.name);
    parts.push(`<span><span class="unit">現物給付</span> <span class="yen">${h.in_kind_count}件</span><span style="font-size:.72rem;opacity:.85;display:block">${ikNames.join("、")}</span></span>`);
  }
  const total=lastResp.results.length;
  const settled=lastResp.results.filter(r=>["decided","ineligible","error","unsupported"].includes(r.status)).length;
  const heroBody=parts.length
    ?`<div class="cap">受け取れる見込み（確定分のみ・下限）</div><div class="amounts">${parts.join("")}</div>`
    :`<div class="cap">受け取れる見込み</div><div class="none">質問に答えると該当制度が見つかる可能性があります</div>`;

  const decided=lastResp.results.filter(r=>r.status==="decided");
  const blocked=lastResp.results.filter(r=>r.status==="blocked");
  const ineligible=lastResp.results.filter(r=>r.status==="ineligible"||r.status==="error"||r.status==="unsupported");

  let rows="";
  if(decided.length){
    rows+=`<details class="prog-section" open><summary>受給見込み（${decided.length}件）</summary>`;
    rows+=decided.map((r,i)=>{
      const statLinks=(r.statute||[]).map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.ref)}</a>`).join("<br>");
      const reasonJa=buildReasonJa(r);
      return`<div class="prow-detail">
        <div class="prow"><span class="pname">${esc(r.name)}</span><span class="pamount">${amountText(r.amount)}</span><span class="badge decided">受給見込み</span><button class="proof-btn" onclick="toggleReason(${i})">根拠を見る</button></div>
        <div class="reason-box hidden" id="reason-${i}">
          <div class="reason-ja">${reasonJa}</div>
          ${statLinks?`<div class="reason-statute"><span style="font-weight:700;font-size:.78rem">条文・出典:</span><br>${statLinks}</div>`:""}
          <button class="proof-btn" style="margin-top:8px" onclick="showProofTree(${i},'${esc(r.program)}')">Prolog推論ツリーを表示</button>
          <div class="proof hidden" id="proof-${i}"></div>
        </div>
      </div>`;
    }).join("");
    rows+="</details>";
  }
  if(blocked.length){
    rows+=`<details class="prog-section" open><summary>あと少し（${blocked.length}件）</summary>`;
    rows+=blocked.map(r=>{
      const m=(r.missing||[]).map(f=>esc(FACT_JA[f]||f)).join("・");
      return`<div class="prow"><span class="pname">${esc(r.name)}</span><span style="font-size:.78rem;color:var(--amber-800)">要確認: ${m}</span><span class="badge blocked">あと少し</span></div>`;
    }).join("");
    rows+="</details>";
  }
  if(ineligible.length){
    rows+=`<details class="prog-section"><summary>対象外（${ineligible.length}件）</summary>`;
    rows+=ineligible.map(r=>`<div class="prow ineligible"><span class="pname">${esc(r.name)}</span><span style="font-size:.78rem;color:var(--ink-faint)">${esc(ja(r.reason||""))}</span></div>`).join("");
    rows+="</details>";
  }

  addCard(`<div class="hero-inline">${heroBody}
    <div class="progress"><div class="bar"><i style="width:${Math.round(settled/total*100)}%"></i></div>
    <span class="num">${settled}/${total} 制度を判定済み（お住まいの区で対象の制度）</span></div>
  </div>${rows}`);
}

function renderNextQuestion(){
  removeOldChips();
  const q=lastResp.next_question;
  if(!q){
    phase="done";
    const blockedLeft=lastResp.results.filter(r=>r.status==="blocked").length;
    if(blockedLeft){
      addAgent(`すべての質問が完了しました。${blockedLeft}件の制度は回答がなかったため確定できませんでした。詳しくはお住まいの自治体窓口でご確認ください。`);
    }else{
      addAgent("すべての制度の判定が完了しました。上の結果カードをご確認ください。");
    }
    return;
  }
  const whyText=q.why.length?`<br><span style="font-size:.82rem;color:var(--ink-sub)">この質問で <b>${q.why.length}制度</b> の判定が進みます</span>`:"";
  addAgent(`<b>${esc(q.text)}</b>${whyText}`);

  let chipsHtml=q.choices.map(c=>{
    const v=JSON.stringify(c.value).replace(/'/g,"&#39;");
    const cls=c.value==="declined"?"chip dim":"chip";
    const ak=JSON.stringify(q.askable_key).replace(/'/g,"&#39;");
    const ch=JSON.stringify(q.child||null).replace(/'/g,"&#39;");
    return`<button class="${cls}" onclick='chipAnswer(${ak},${v},${ch})'>${esc(c.label)}</button>`;
  }).join("");

  let numHtml="";
  if(q.input==="number"){
    const ak=JSON.stringify(q.askable_key).replace(/'/g,"&#39;");
    numHtml=`<div class="chip-row-num"><input type="number" id="num-in" placeholder="金額（円）"><button class="chip" onclick='numAnswer(${ak})'>送信</button></div>`;
  }
  addChips(`<div class="chips live-chips">${chipsHtml}</div>${numHtml}`);
}

function chipAnswer(key,value,childId){
  const label=document.querySelector(".live-chips .chip:not(.dim)")?.textContent||String(value);
  // find label from clicked button
  const btns=document.querySelectorAll(".live-chips .chip");
  let clickedLabel=String(value);
  btns.forEach(b=>{try{if(JSON.parse(b.getAttribute("onclick").match(/,([^,]+),/)?.[1]||"null")===value)clickedLabel=b.textContent;}catch(e){}});
  addUser(clickedLabel||String(value));
  removeOldChips();
  if(childId){
    const ch=facts.children.find(c=>c.id===childId);
    if(ch)ch.askable[key]=value;
  }else{
    facts.askable[key]=value;
  }
  doJudge();
}
function numAnswer(key){
  const v=parseInt(document.getElementById("num-in").value,10);
  if(isNaN(v))return;
  addUser(yen(v));
  removeOldChips();
  facts.askable[key]=v;
  doJudge();
}

// ---- reason / proof ----
const ASKABLE_JA={
  nenshu:"年収",shotoku_exact:"所得（控除後）",hitorioya:"ひとり親である",
  hitorioya_jiyuu:"ひとり親の事由",seikei_douitsu_partner:"事実婚でない",
  fuyou_ninzu:"扶養親族の人数",kenkou_hoken:"健康保険に加入している",
  ninshin:"妊娠中である",seikatsu_hogo:"生活保護を受給していない",
  hikazei:"住民税非課税世帯である",shogai_techo:"障害者手帳",
  koyou_hoken:"雇用保険に加入している",rishoku:"離職中である",
  nanbyo_nintei:"難病認定を受けている",hoken_shubetsu:"健康保険の種類",
  byouki_kyugyou:"病気・ケガで休業中である",kaigo_family:"家族の介護で休業中である",
  daigaku_zaigaku:"大学等に在学中である",kaigo_nintei:"要介護認定を受けている",
  haiguusha:"配偶者がいる",jutaku_loan:"住宅ローンを組んでいる",
  iryouhi_10man:"年間医療費が10万円を超えている",seimei_hoken:"生命保険に加入している",
  jishin_hoken:"地震保険に加入している",
};
const VAL_JA={
  "true":"はい","false":"いいえ","shakai_hoken":"社会保険",
  "kokuho":"国民健康保険","nashi":"持っていない",
  "shintai_1":"身体1級","shintai_2":"身体2級","shintai_3":"身体3級",
  "ryoiku":"愛の手帳","seishin_1":"精神1級","seishin_2":"精神2級",
  "rikon":"離婚","shibou":"死別","mikon":"未婚",
};
function fmtVal(key,v){
  if(v==="declined")return null;
  if(v===true)return null;
  if(v===false)return"いいえ";
  if(Array.isArray(v))return`${(v[0]/10000).toFixed(0)}万〜${(v[1]/10000).toFixed(0)}万円`;
  if(typeof v==="number")return v.toLocaleString("ja-JP")+(key.includes("nenshu")||key.includes("shotoku")?"円":"");
  return VAL_JA[v]||String(v);
}
function buildReasonJa(r){
  let items=[];
  // Extract which facts the user answered that led to this decision
  const ak=facts.askable||{};
  // Map program's required conditions from the Prolog detail
  const detail=(r.children||[]).find(s=>s.kind==="decided")?.detail||"";

  // Build "your answers that matched" from the askable facts
  // We check which askable keys are relevant by looking at questions that
  // this program's rules would check. Since we don't have that mapping client-side,
  // we use a heuristic: show all non-null, non-declined askable values that
  // differ from the "universal" default (everyone has them).
  // Better: use the program's "missing" from when it was blocked.
  // The result card has "children" with subject results - each has the raw Prolog term.
  // We parse the decided detail to understand what was checked.

  // Strategy: show answered facts as "conditions met"
  const relevantKeys=guessRelevantKeys(r.program, detail);
  for(const key of relevantKeys){
    const v=ak[key];
    if(v===undefined||v===null||v==="declined")continue;
    const label=ASKABLE_JA[key]||FACT_JA[key]||key;
    const valStr=fmtVal(key,v);
    if(v===true) items.push(label);
    else if(valStr) items.push(`${label}: ${valStr}`);
  }

  // Amount info
  const numMatch=detail.match(/(?:amount|monthly|yearly|oneoff)\((\d+)\)/);
  if(numMatch){
    const v=parseInt(numMatch[1]);
    const unitMap={monthly:"月額",yearly:"年額",oneoff:"一時金"};
    const u=Object.keys(unitMap).find(k=>detail.startsWith(k+"("));
    items.push(`→ ${u?unitMap[u]:""}${v.toLocaleString("ja-JP")}円`);
  }
  if(detail.startsWith("in_kind")) items.push("→ 現物給付（自己負担分を助成）");
  if(detail==="zenbu") items.push("→ 全部支給");
  if(detail==="ichibu") items.push("→ 一部支給（所得に応じた減額）");
  if(detail.match(/amount_yearly\((\d+)\)/)){
    const ym=detail.match(/amount_yearly\((\d+)\)/);
    items.push(`→ 年額${parseInt(ym[1]).toLocaleString("ja-JP")}円`);
  }

  if(!items.length) items.push("判定条件を満たしています");
  return'<div style="font-size:.8rem;font-weight:700;color:var(--ink-sub);margin-bottom:4px">あなたが該当する理由:</div><ul>'+items.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>";
}

    kyouiku_kunren_kyufu:["koyou_hoken"],

    kaigo_kyuugyou_kyufu:["koyou_hoken","kaigo_family"],
    kougaku_ryouyouhi:["kenkou_hoken"],
    shoubyou_teatekin:["hoken_shubetsu","byouki_kyugyou"],
    hikazei_setai_kyufukin:["hikazei","seikatsu_hogo"],
    nyuuin_shokuji_gengaku:["hikazei"],
    kokuho_keigen:["hoken_shubetsu","nenshu"],
    kokumin_nenkin_menjo:["nenshu","seikatsu_hogo"],
    jukyo_kakuho_kyufukin:["rishoku","seikatsu_hogo"],

    shougai_kiso_nenkin:["shogai_techo"],
    tokubetsu_shogaisha_teate:["shogai_techo","nenshu","fuyou_ninzu"],
    toei_kotsu_muryou:["shogai_techo"],
    tokyo_suidou_genmen:["seikatsu_hogo","shogai_techo","hitorioya"],
    silver_pass:[],
    kaigo_hokenryo_genmen:["hikazei"],
    kougaku_kaigo_service:["kaigo_nintei"],
    ninpu_kensin_josei:["ninshin"],
    sanzen_sango_nenkin_menjo:["ninshin"],
    shussan_teatekin:["ninshin","hoken_shubetsu"],
    shussan_ikuji_ichijikin:["ninshin","kenkou_hoken"],
    boshi_jiritsu_kyouiku:["hitorioya"],
    boshi_koutou_kunren:["hitorioya"],
    koutou_kyouiku_shien:["hikazei","daigaku_zaigaku"],
    kyufu_shougakukin:["hikazei","daigaku_zaigaku"],

    seimei_hoken_koujo:["seimei_hoken"],
    jishin_hoken_koujo:["jishin_hoken"],
    jutaku_loan_koujo:["jutaku_loan"],
    haiguusha_koujo:["haiguusha"],
    hitorioya_iryo_josei:["hitorioya","kenkou_hoken","nenshu","fuyou_ninzu"],
    jidou_fuyou_teate:["hitorioya","hitorioya_jiyuu","seikei_douitsu_partner","nenshu","fuyou_ninzu"],
    jidou_teate:[],
    tokyo_018_support:[],

  return PROG_KEYS[program]||Object.keys(ASKABLE_JA);
}
function toggleReason(idx){
  const box=document.getElementById("reason-"+idx);
  if(box)box.classList.toggle("hidden");
}
async function showProofTree(idx,program){
  const box=document.getElementById("proof-"+idx);
  if(!box)return;
  box.classList.toggle("hidden");
  if(box.innerHTML)return;
  const r=lastResp.results.find(x=>x.program===program);
  const subj=(r.children||[]).find(s=>s.kind==="decided");
  const res=await fetch("/api/proof",{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({facts,program,subject:subj?subj.subject:"self",municipality})});
  if(!res.ok){box.textContent="取得できませんでした";return;}
  const body=await res.json();
  try{box.innerHTML=`<div class="proof-title">Prolog推論ツリー</div><ul>`+renderProof(parseTerm(body.proof))+"</ul>";}
  catch(e){box.textContent=body.proof;}
}
function parseTerm(s){
  let i=0;
  function ws(){while(i<s.length&&s[i]===" ")i++;}
  function term(){
    ws();
    if(s[i]==="'"){let buf="";i++;while(s[i]!=="'"){buf+=s[i++];}i++;return{f:buf,args:[]};}
    if(s[i]==="["){i++;const items=[];ws();
      if(s[i]==="]"){i++;return{list:items};}
      for(;;){items.push(term());ws();if(s[i]===","){i++;continue;}if(s[i]==="]"){i++;break;}}
      return{list:items};}
    let j=i;while(i<s.length&&/[A-Za-z0-9_.\-]/.test(s[i]))i++;
    const name=s.slice(j,i);
    if(s[i]==="("){i++;const args=[];
      for(;;){args.push(term());ws();if(s[i]===","){i++;continue;}if(s[i]===")"){i++;break;}}
      return{f:name,args};}
    return{f:name,args:[]};
  }
  return term();
}
function fmtGoal(t){
  if(t.list)return"["+t.list.map(fmtGoal).join(", ")+"]";
  if(!t.args.length)return esc(t.f);
  return esc(t.f)+"("+t.args.map(fmtGoal).join(", ")+")";
}
function renderProof(t){
  if(!t||!t.f)return"";
  if(t.f==="true"||t.f==="cut")return"";
  if(t.f==="and")return t.args.map(renderProof).join("");
  if(t.f==="or")return renderProof(t.args[0]);
  if(t.f==="naf")return`<li class="naf">「<code>${fmtGoal(t.args[0])}</code>」に該当しない</li>`;
  if(t.f==="builtin")return`<li><code>${fmtGoal(t.args[0])}</code></li>`;
  if(t.f==="node"){
    const sub=renderProof(t.args[1]);
    return`<li><strong><code>${fmtGoal(t.args[0])}</code></strong>${sub?`<ul>${sub}</ul>`:""}</li>`;
  }
  return`<li><code>${fmtGoal(t)}</code></li>`;
}
