# 練馬区第3子誕生祝金 golden cases
# Source: https://www.city.nerima.tokyo.jp/kosodatekyoiku/shussan/iwaikin.html
# 第3子以降の出生児1人10万円

- name: nerima_3rd_child_decided
  as_of: "2026-06-15"
  facts:
    claimant: { birth_date: "1990-01-01" }
    children:
      - { id: c1, birth_date: "2018-01-01" }
      - { id: c2, birth_date: "2020-06-01" }
      - { id: c3, birth_date: "2026-03-01" }
  expect: { subject: c3, status: decided, detail: "oneoff(100000)" }

- name: nerima_not_3rd_child
  as_of: "2026-06-15"
  facts:
    claimant: { birth_date: "1990-01-01" }
    children:
      - { id: c1, birth_date: "2026-03-01" }
  expect: { subject: c1, status: ineligible, detail: "not_3rd_child" }

- name: nerima_age_over
  as_of: "2026-06-15"
  facts:
    claimant: { birth_date: "1990-01-01" }
    children:
      - { id: c1, birth_date: "2018-01-01" }
      - { id: c2, birth_date: "2020-06-01" }
      - { id: c3, birth_date: "2022-01-01" }
  expect: { subject: c3, status: ineligible, detail: "age_over" }
