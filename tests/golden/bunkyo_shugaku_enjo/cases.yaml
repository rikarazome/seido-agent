# 文京区就学援助 golden cases
# 条文: 区内小中学校在学+所得基準以下（hikazeiで近似）
# 金額: 学年・費目別（給食費実費、学用品費37,866〜68,586円等）

- name: bunkyo_enjo_decided
  as_of: "2026-06-15"
  facts:
    claimant: { birth_date: "1985-01-01" }
    children:
      - { id: c1, birth_date: "2017-06-01" }   # FY-end age 9
    askable: { hikazei: true }
  expect: { subject: c1, status: decided, detail: "kubun(shugaku_enjo)" }

- name: bunkyo_enjo_ineligible_income
  as_of: "2026-06-15"
  facts:
    claimant: { birth_date: "1985-01-01" }
    children:
      - { id: c1, birth_date: "2017-06-01" }
    askable: { hikazei: false }
  expect: { subject: c1, status: ineligible, detail: "not_low_income" }

- name: bunkyo_enjo_ineligible_age
  as_of: "2026-06-15"
  facts:
    claimant: { birth_date: "1985-01-01" }
    children:
      - { id: c1, birth_date: "2022-06-01" }   # FY-end age 3
    askable: { hikazei: true }
  expect: { subject: c1, status: ineligible, detail: "not_school_age" }

- name: bunkyo_enjo_blocked
  as_of: "2026-06-15"
  facts:
    claimant: { birth_date: "1985-01-01" }
    children:
      - { id: c1, birth_date: "2017-06-01" }
    askable: {}
  expect: { subject: c1, status: blocked, detail: "[hikazei]" }
