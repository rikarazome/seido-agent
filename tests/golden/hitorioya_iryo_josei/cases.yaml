# ひとり親家庭等医療費助成 golden cases（statute_source.md）
# subject: claimant (self), amount_type: in_kind
# income limit: 1,920,000 + 380,000 * fuyou_ninzu

- name: maruoya_decided_low_income
  as_of: "2026-06-15"
  facts:
    claimant: { birth_date: "1990-01-01" }
    children: [ { id: c1, birth_date: "2020-01-01" } ]
    askable: { hitorioya: true, seikei_douitsu_partner: false, fuyou_ninzu: 1, shotoku_exact: 1500000 }
  expect: { subject: self, status: decided, detail: "in_kind" }
  # limit(1) = 2,300,000. shotoku 1,500,000 < limit -> decided

