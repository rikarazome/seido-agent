# 足立区就学援助 golden cases
# 条文: 区内在住+小中学校児童生徒+所得基準未満（hikazeiで近似）
# 金額: 費目別で個人差あり。条文に固定額なし→kubun(shugaku_enjo)

- name: adachi_enjo_decided
  as_of: "2026-06-15"
  facts:
    claimant: { birth_date: "1985-01-01" }
    children:
      - { id: c1, birth_date: "2017-06-01" }   # FY-end age 9 (小学生)
    askable: { hikazei: true }
  expect: { subject: c1, status: decided, detail: "kubun(shugaku_enjo)" }

- name: adachi_enjo_ineligible_income
  as_of: "2026-06-15"
  facts:
    claimant: { birth_date: "1985-01-01" }
    children:
      - { id: c1, birth_date: "2017-06-01" }
    askable: { hikazei: false }
  expect: { subject: c1, status: ineligible, detail: "not_low_income" }

- name: adachi_enjo_ineligible_age
  as_of: "2026-06-15"
  facts:
    claimant: { birth_date: "1985-01-01" }
    children:
      - { id: c1, birth_date: "2022-06-01" }   # FY-end age 3 (未就学)
    askable: { hikazei: true }
  expect: { subject: c1, status: ineligible, detail: "not_school_age" }

- name: adachi_enjo_blocked
  as_of: "2026-06-15"
  facts:
    claimant: { birth_date: "1985-01-01" }
    children:
      - { id: c1, birth_date: "2017-06-01" }
    askable: {}
  expect: { subject: c1, status: blocked, detail: "[hikazei]" }

- name: adachi_enjo_boundary_age6
  as_of: "2026-06-15"
  facts:
    claimant: { birth_date: "1985-01-01" }
    children:
      - { id: c1, birth_date: "2020-02-01" }   # FY-end age 6 (小1)
    askable: { hikazei: true }
  expect: { subject: c1, status: decided, detail: "kubun(shugaku_enjo)" }

- name: adachi_enjo_boundary_age15
  as_of: "2026-06-15"
  facts:
    claimant: { birth_date: "1985-01-01" }
    children:
      - { id: c1, birth_date: "2011-06-01" }   # FY-end age 15 (中3)
    askable: { hikazei: true }
  expect: { subject: c1, status: decided, detail: "kubun(shugaku_enjo)" }
