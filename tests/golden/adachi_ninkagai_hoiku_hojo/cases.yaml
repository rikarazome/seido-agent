# Source: city.adachi.tokyo.jp/kodomo-nyuuen/ninnkagai_teikiriyou.html

- name: adachi_ninkagai_age1_decided
  as_of: "2026-06-15"
  facts:
    claimant: { birth_date: "1990-01-01" }
    children: [ { id: c1, birth_date: "2025-06-01" } ]   # FY-end age 1
    askable: { hikazei: true }
  expect: { subject: c1, status: decided, detail: "monthly(80000)" }

