    claimant: { birth_date: "1970-01-01" }
    children: []
    askable: { shogai_techo: "shintai_1", fuyou_ninzu: 0, shotoku_exact: 3000000 }
  expect: { subject: self, status: decided, detail: "monthly(60000)" }

