  as_of: "2026-06-15"
  facts:
    claimant: { birth_date: "1980-01-01" }
    children: []
    askable: { shogai_techo: "shintai_1", seikatsu_hogo: false, fuyou_ninzu: 0, shotoku_exact: 3000000 }
  expect: { subject: self, status: decided, detail: "in_kind" }
