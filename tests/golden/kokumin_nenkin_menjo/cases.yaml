- name: zenmen_single
  as_of: "2026-06-15"
  municipality: shibuya
  facts:
    askable:
      nenshu: 1000000
      seikatsu_hogo: false
      fuyou_ninzu: 0
  expect:
    subject: self
    status: decided
    detail: kubun(zenmen)

