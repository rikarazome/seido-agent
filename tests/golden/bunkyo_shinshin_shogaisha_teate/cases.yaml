# 文京区心身障害者等福祉手当 golden cases
# 条文: grade_a=15,500円、grade_b(身体3/愛の手帳4)=13,500円
# 精神は別制度（精神障害者福祉手当）→ この制度ではineligible

- name: bunkyo_shinshin_decided_a
  as_of: "2026-06-15"
  facts:
    claimant: { birth_date: "1970-01-01" }
    children: []
    askable: { shogai_techo: "shintai_1" }
  expect: { subject: self, status: decided, detail: "monthly(15500)" }

- name: bunkyo_shinshin_decided_b
  as_of: "2026-06-15"
  facts:
    claimant: { birth_date: "1970-01-01" }
    children: []
    askable: { shogai_techo: "shintai_3" }
  expect: { subject: self, status: decided, detail: "monthly(13500)" }

- name: bunkyo_shinshin_ineligible_seishin
  as_of: "2026-06-15"
  facts:
    claimant: { birth_date: "1970-01-01" }
    children: []
    askable: { shogai_techo: "seishin_1" }
  expect: { subject: self, status: ineligible, detail: "grade_not_covered" }

- name: bunkyo_shinshin_ineligible_age
  as_of: "2026-06-15"
  facts:
    claimant: { birth_date: "1955-01-01" }
    children: []
    askable: { shogai_techo: "shintai_1" }
  expect: { subject: self, status: ineligible, detail: "age_65_or_over" }

- name: bunkyo_shinshin_blocked
  as_of: "2026-06-15"
  facts:
    claimant: { birth_date: "1970-01-01" }
    children: []
    askable: {}
  expect: { subject: self, status: blocked, detail: "[shogai_techo]" }
