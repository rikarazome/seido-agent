# 出産育児一時金 golden cases（statute_source.md）
# subject: claimant (self), amount: oneoff 500,000

- name: shuiku_decided_pregnant_insured
  as_of: "2026-06-15"
  facts:
    claimant: { birth_date: "1990-05-01" }
    children: []
    askable: { ninshin: true, kenkou_hoken: true }
  expect: { subject: self, status: decided, detail: "amount(500000)" }

- name: shuiku_not_pregnant
  as_of: "2026-06-15"
  facts:
    claimant: { birth_date: "1990-05-01" }
    children: []
    askable: { ninshin: false, kenkou_hoken: true }
  expect: { subject: self, status: ineligible, detail: "not_pregnant" }

- name: shuiku_no_insurance
  as_of: "2026-06-15"
  facts:
    claimant: { birth_date: "1990-05-01" }
    children: []
    askable: { ninshin: true, kenkou_hoken: false }
  expect: { subject: self, status: ineligible, detail: "no_health_insurance" }

- name: shuiku_blocked_ninshin_unknown
  as_of: "2026-06-15"
  facts:
    claimant: { birth_date: "1990-05-01" }
    children: []
    askable: { kenkou_hoken: true }
  expect: { subject: self, status: blocked, detail: "[ninshin]" }

- name: shuiku_blocked_both_unknown
  as_of: "2026-06-15"
  facts:
    claimant: { birth_date: "1990-05-01" }
    children: []
    askable: {}
  expect: { subject: self, status: blocked, detail: "[kenkou_hoken,ninshin]" }

- name: shuiku_blocked_hoken_unknown
  as_of: "2026-06-15"
  facts:
    claimant: { birth_date: "1990-05-01" }
    children: []
    askable: { ninshin: true }
  expect: { subject: self, status: blocked, detail: "[kenkou_hoken]" }

- name: shuiku_both_false
  as_of: "2026-06-15"
  facts:
    claimant: { birth_date: "1990-05-01" }
    children: []
    askable: { ninshin: false, kenkou_hoken: false }
  expect: { subject: self, status: ineligible, detail: "not_pregnant" }

- name: shuiku_not_pregnant_hoken_unknown
  as_of: "2026-06-15"
  facts:
    claimant: { birth_date: "1990-05-01" }
    children: []
    askable: { ninshin: false }
  expect: { subject: self, status: ineligible, detail: "not_pregnant" }
  # regression: must NOT be blocked([kenkou_hoken]) -- ninshin=false is decisive

- name: shuiku_with_children_still_claimant
  as_of: "2026-06-15"
  facts:
    claimant: { birth_date: "1990-05-01" }
    children: [ { id: c1, birth_date: "2023-01-01" } ]
    askable: { ninshin: true, kenkou_hoken: true }
  expect: { subject: self, status: decided, detail: "amount(500000)" }
