# 出産・子育て応援交付金 golden cases（statute_source.md）
# subject: claimant (self), amount: oneoff 100,000

- name: ouen_decided_pregnant
  as_of: "2026-06-15"
  facts:
    claimant: { birth_date: "1992-03-01" }
    children: []
    askable: { ninshin: true }
  expect: { subject: self, status: decided, detail: "amount(100000)" }

- name: ouen_not_pregnant
  as_of: "2026-06-15"
  facts:
    claimant: { birth_date: "1992-03-01" }
    children: []
    askable: { ninshin: false }
  expect: { subject: self, status: ineligible, detail: "not_pregnant" }

- name: ouen_blocked_ninshin_unknown
  as_of: "2026-06-15"
  facts:
    claimant: { birth_date: "1992-03-01" }
    children: []
    askable: {}
  expect: { subject: self, status: blocked, detail: "[ninshin]" }

- name: ouen_with_existing_children
  as_of: "2026-06-15"
  facts:
    claimant: { birth_date: "1992-03-01" }
    children: [ { id: c1, birth_date: "2023-01-01" } ]
    askable: { ninshin: true }
  expect: { subject: self, status: decided, detail: "amount(100000)" }

- name: ouen_declined_ninshin
  as_of: "2026-06-15"
  facts:
    claimant: { birth_date: "1992-03-01" }
    children: []
    askable: { ninshin: "declined" }
  expect: { subject: self, status: blocked, detail: "[ninshin]" }
