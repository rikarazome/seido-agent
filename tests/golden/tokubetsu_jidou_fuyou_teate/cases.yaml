# 特別児童扶養手当 golden cases（statute_source.md）
# subject: child, amount: monthly per_child
# 1級(shintai_1, ryoiku): 55,350, 2級(shintai_2): 36,860
# income limit: 4,596,000 + 380,000 * N

- name: tokujif_decided_1kyu
  as_of: "2026-06-15"
  facts:
    claimant: { birth_date: "1980-01-01" }
    children:
      - { id: c1, birth_date: "2015-01-01", askable: { shogai_techo_child: "shintai_1" } }
    askable: { fuyou_ninzu: 1, shotoku_exact: 4000000 }
  expect: { subject: c1, status: decided, detail: "monthly(55350)" }

