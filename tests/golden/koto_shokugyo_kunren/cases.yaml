# 高等職業訓練促進給付金 golden cases（statute_source.md）
# subject: claimant (self), amount: monthly 100,000 (non-taxable) / 70,500 (taxable)
# income limit: jidou_fuyou_teate zenbu limit = 1,490,000 + 380,000 * N

- name: kunren_decided_hikazei
  as_of: "2026-06-15"
  facts:
    claimant: { birth_date: "1985-01-01" }
    children: [ { id: c1, birth_date: "2015-01-01" } ]
    askable: { hitorioya: true, hikazei: true, fuyou_ninzu: 1, shotoku_exact: 1000000 }
  expect: { subject: self, status: decided, detail: "monthly(100000)" }

- name: kunren_decided_kazei
  as_of: "2026-06-15"
  facts:
    claimant: { birth_date: "1985-01-01" }
    children: [ { id: c1, birth_date: "2015-01-01" } ]
    askable: { hitorioya: true, hikazei: false, fuyou_ninzu: 1, shotoku_exact: 1000000 }
  expect: { subject: self, status: decided, detail: "monthly(70500)" }

- name: kunren_ineligible_not_single_parent
  as_of: "2026-06-15"
  facts:
    claimant: { birth_date: "1985-01-01" }
    children: [ { id: c1, birth_date: "2015-01-01" } ]
    askable: { hitorioya: false }
  expect: { subject: self, status: ineligible, detail: "not_single_parent" }

- name: kunren_ineligible_income_over
  as_of: "2026-06-15"
  facts:
    claimant: { birth_date: "1985-01-01" }
    children: [ { id: c1, birth_date: "2015-01-01" } ]
    askable: { hitorioya: true, hikazei: false, fuyou_ninzu: 1, shotoku_exact: 2000000 }
  expect: { subject: self, status: ineligible, detail: "income_over" }
  # limit(1) = 1,870,000. shotoku 2,000,000 >= limit

- name: kunren_blocked_hitorioya_unknown
  as_of: "2026-06-15"
  facts:
    claimant: { birth_date: "1985-01-01" }
    children: [ { id: c1, birth_date: "2015-01-01" } ]
    askable: { fuyou_ninzu: 1, shotoku_exact: 1000000 }
  expect: { subject: self, status: blocked, detail: "[hikazei,hitorioya]" }

- name: kunren_no_children
  as_of: "2026-06-15"
  facts:
    claimant: { birth_date: "1985-01-01" }
    children: []
    askable: { hitorioya: true, hikazei: true, fuyou_ninzu: 0, shotoku_exact: 1000000 }
  expect: { subject: self, status: ineligible, detail: "no_child" }
