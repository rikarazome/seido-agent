# 難病医療費助成 golden cases（statute_source.md）
# subject: claimant (self), amount_type: in_kind

- name: nanbyo_decided
  as_of: "2026-06-15"
  facts:
    claimant: { birth_date: "1975-01-01" }
    children: []
    askable: { nanbyo_nintei: true }
  expect: { subject: self, status: decided, detail: "in_kind" }

- name: nanbyo_not_certified
  as_of: "2026-06-15"
  facts:
    claimant: { birth_date: "1975-01-01" }
    children: []
    askable: { nanbyo_nintei: false }
  expect: { subject: self, status: ineligible, detail: "not_certified" }

- name: nanbyo_blocked
  as_of: "2026-06-15"
  facts:
    claimant: { birth_date: "1975-01-01" }
    children: []
    askable: {}
  expect: { subject: self, status: blocked, detail: "[nanbyo_nintei]" }

- name: nanbyo_with_children
  as_of: "2026-06-15"
  facts:
    claimant: { birth_date: "1975-01-01" }
    children: [ { id: c1, birth_date: "2015-01-01" } ]
    askable: { nanbyo_nintei: true }
  expect: { subject: self, status: decided, detail: "in_kind" }

- name: nanbyo_declined
  as_of: "2026-06-15"
  facts:
    claimant: { birth_date: "1975-01-01" }
    children: []
    askable: { nanbyo_nintei: "declined" }
  expect: { subject: self, status: blocked, detail: "[nanbyo_nintei]" }
