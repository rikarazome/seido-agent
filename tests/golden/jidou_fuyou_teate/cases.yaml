# 児童扶養手当 golden cases（rule-schema v1 / facts JSON同形）
# 限度額・手当額は VERIFIED（statute_source.md 参照。限度額=施行令2条の4、
# 手当額=令和8年度値: 全部48,050 / 逓減 48,040-(所得-限度額)*0.0264029 / 加算11,350・0.0040719 / 10円丸め）
# nenshu は給与所得控除の概算変換が適用される（salary_to_shotoku）。点値所得は shotoku_exact で指定。
# 基本世帯: 子1人（FY末年齢7）。amount は世帯月額（per_household、teate_amount/2）

- name: jft_partner_unknown_blocks
  as_of: "2026-06-11"
  facts:
    claimant: { birth_date: "1988-04-01" }
    children: [ { id: c1, birth_date: "2019-06-01" } ]
    askable: { nenshu: 1000000, hitorioya: true, hitorioya_jiyuu: rikon,
               seikei_douitsu_partner: null, fuyou_ninzu: 2 }
  expect: { subject: c1, status: blocked, detail: "[seikei_douitsu_partner]" }
  # NAFバグ回帰: 除外事由が未知のとき誤decidedを返さない（v0設計の致命傷）

- name: jft_declined_still_blocked
  as_of: "2026-06-11"
  facts:
    claimant: { birth_date: "1988-04-01" }
    children: [ { id: c1, birth_date: "2019-06-01" } ]
    askable: { nenshu: 1000000, hitorioya: true, hitorioya_jiyuu: rikon,
               seikei_douitsu_partner: declined, fuyou_ninzu: 2 }
  expect: { subject: c1, status: blocked, detail: "[seikei_douitsu_partner]" }
  # declined は Prolog 上は未知と同一（質問選定だけが区別する）

- name: jft_jiyuu_unknown_blocks
  as_of: "2026-06-11"
  facts:
    claimant: { birth_date: "1988-04-01" }
    children: [ { id: c1, birth_date: "2019-06-01" } ]
    askable: { nenshu: 1000000, hitorioya: true, hitorioya_jiyuu: null,
               seikei_douitsu_partner: false, fuyou_ninzu: 2 }
  expect: { subject: c1, status: blocked, detail: "[hitorioya_jiyuu]" }

- name: jft_zenbu_shikyu
  as_of: "2026-06-11"
  facts:
    claimant: { birth_date: "1988-04-01" }
    children: [ { id: c1, birth_date: "2019-06-01" } ]
    askable: { nenshu: 1000000, hitorioya: true, hitorioya_jiyuu: rikon,
               seikei_douitsu_partner: false, fuyou_ninzu: 2 }
  expect: { subject: c1, status: decided, detail: "zenbu", amount: 48050 }
  # R8全部支給 第1子 48,050円

- name: jft_ichibu_shikyu
  as_of: "2026-06-11"
  facts:
    claimant: { birth_date: "1988-04-01" }
    children: [ { id: c1, birth_date: "2019-06-01" } ]
    askable: { shotoku_exact: 1500000, hitorioya: true, hitorioya_jiyuu: rikon,
               seikei_douitsu_partner: false, fuyou_ninzu: 2 }
  expect: { subject: c1, status: decided, detail: "ichibu", amount: 46720 }
  # zenbu_limit(2)=1450000 <= 1500000 < ichibu_limit(2)=2840000
  # 48,040 - (1,500,000-1,450,000)*0.0264029 = 46,719.855 → 10円丸め 46,720

- name: jft_fuyou3_formula_limits
  as_of: "2026-06-11"
  facts:
    claimant: { birth_date: "1988-04-01" }
    children: [ { id: c1, birth_date: "2019-06-01" } ]
    askable: { nenshu: 1000000, hitorioya: true, hitorioya_jiyuu: rikon,
               seikei_douitsu_partner: false, fuyou_ninzu: 3 }
  expect: { subject: c1, status: decided, detail: "zenbu" }
  # 網羅漏れ回帰: 旧・表形式限度額は N=3 で解なしになった（加算式で全N定義）

- name: jft_range_straddle_blocks
  as_of: "2026-06-11"
  facts:
    claimant: { birth_date: "1988-04-01" }
    children: [ { id: c1, birth_date: "2019-06-01" } ]
    askable: { nenshu: [1000000, 3000000], hitorioya: true, hitorioya_jiyuu: rikon,
               seikei_douitsu_partner: false, fuyou_ninzu: 2 }
  expect: { subject: c1, status: blocked, detail: "[income_exact]" }
  # レンジが限度額を跨ぐ → 正確な額の質問を誘発（v_indet）

- name: jft_income_over_ineligible
  as_of: "2026-06-11"
  facts:
    claimant: { birth_date: "1988-04-01" }
    children: [ { id: c1, birth_date: "2019-06-01" } ]
    askable: { nenshu: 5000000, hitorioya: true, hitorioya_jiyuu: rikon,
               seikei_douitsu_partner: false, fuyou_ninzu: 2 }
  expect: { subject: c1, status: ineligible,
            detail: "'income exceeds partial-payment limit'" }

- name: jft_partner_cohabit_ineligible
  as_of: "2026-06-11"
  facts:
    claimant: { birth_date: "1988-04-01" }
    children: [ { id: c1, birth_date: "2019-06-01" } ]
    askable: { nenshu: 1000000, hitorioya: true, hitorioya_jiyuu: rikon,
               seikei_douitsu_partner: true, fuyou_ninzu: 2 }
  expect: { subject: c1, status: ineligible,
            detail: "'child shares livelihood with parent de-facto spouse (Art.4(2) analog)'" }

- name: jft_shotoku_exact_overrides_range
  as_of: "2026-06-11"
  facts:
    claimant: { birth_date: "1988-04-01" }
    children: [ { id: c1, birth_date: "2019-06-01" } ]
    askable: { nenshu: [1000000, 3000000], shotoku_exact: 1500000,
               hitorioya: true, hitorioya_jiyuu: rikon,
               seikei_douitsu_partner: false, fuyou_ninzu: 2 }
  expect: { subject: c1, status: decided, detail: "ichibu", amount: 46720 }
  # ハイブリッド方式: income_exact質問の回答（控除後所得の点値）は shotoku_exact に入り、
  # nenshu由来のレンジ（跨ぎ→blockedになるはず）を上書きして判定が確定する

- name: jft_amount_zenbu_two_children
  as_of: "2026-06-11"
  facts:
    claimant: { birth_date: "1988-04-01" }
    children:
      - { id: c1, birth_date: "2019-06-01" }   # FY-end 7
      - { id: c2, birth_date: "2023-08-01" }   # FY-end 3
    askable: { nenshu: 1000000, hitorioya: true, hitorioya_jiyuu: rikon,
               seikei_douitsu_partner: false, fuyou_ninzu: 2 }
  expect: { subject: c1, status: decided, detail: "zenbu", amount: 59400 }
  # 48,050 + 加算11,350 = 59,400

- name: jft_amount_ichibu_two_children
  as_of: "2026-06-11"
  facts:
    claimant: { birth_date: "1988-04-01" }
    children:
      - { id: c1, birth_date: "2019-06-01" }
      - { id: c2, birth_date: "2023-08-01" }
    askable: { shotoku_exact: 1500000, hitorioya: true, hitorioya_jiyuu: rikon,
               seikei_douitsu_partner: false, fuyou_ninzu: 2 }
  expect: { subject: c1, status: decided, detail: "ichibu", amount: 57860 }
  # 本体 46,720 + 加算 11,340-(50,000*0.0040719)=11,136.405 → 11,140。計 57,860

- name: jft_not_hitorioya_ineligible
  as_of: "2026-06-11"
  facts:
    claimant: { birth_date: "1988-04-01" }
    children: [ { id: c1, birth_date: "2019-06-01" } ]
    askable: { nenshu: 1000000, hitorioya: false, hitorioya_jiyuu: null,
               seikei_douitsu_partner: null, fuyou_ninzu: 2 }
  expect: { subject: c1, status: ineligible,
            detail: "'no single-parent cause (Art.4(1))'" }
