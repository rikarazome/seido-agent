- name: juken_ineligible_income_over
  as_of: "2026-06-15"
  facts:
    claimant: { birth_date: "1980-01-01" }
    children:
      - { id: c1, birth_date: "2012-02-01" }   # chu3
    askable: { fuyou_ninzu: 0, shotoku_exact: 2500000 }
  expect: { subject: c1, status: ineligible, detail: "income_over" }
  # limit(0) = 2,322,000. shotoku 2,500,000 >= limit

- name: juken_blocked_income_unknown
  as_of: "2026-06-15"
