# 受験生チャレンジ支援貸付 golden cases（statute_source.md）
# subject: child, amount: oneoff 200,000
# age: FY-end 14-15 (chu3) or 17-18 (ko3)
# income limit: 2,322,000 + 490,000 * N (approximate)

- name: juken_decided_chu3
  as_of: "2026-06-15"
  facts:
    claimant: { birth_date: "1980-01-01" }
    children:
      - { id: c1, birth_date: "2012-02-01" }   # FY-end age 15 (chu3)
    askable: { fuyou_ninzu: 1, shotoku_exact: 2500000 }
  expect: { subject: c1, status: decided, detail: "oneoff(200000)" }
  # limit(1) = 2,812,000. shotoku 2,500,000 < limit

- name: juken_decided_ko3
  as_of: "2026-06-15"
  facts:
    claimant: { birth_date: "1980-01-01" }
    children:
      - { id: c1, birth_date: "2009-02-01" }   # FY-end age 18 (ko3)
    askable: { fuyou_ninzu: 1, shotoku_exact: 2500000 }
  expect: { subject: c1, status: decided, detail: "oneoff(200000)" }

