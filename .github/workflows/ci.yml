# PR-stage CI: deterministic only, zero LLM calls (docs/dev-methodology.md)
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SWI-Prolog
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends swi-prolog
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
