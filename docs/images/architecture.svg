<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
  </defs>

  <style>
    text { font-family: "Yu Gothic UI", "Meiryo", "Noto Sans JP", sans-serif; fill: #0f172a; }
    .title { font-size: 34px; font-weight: 700; }
    .subtitle { font-size: 20px; fill: #475569; }
    .zone-label { font-size: 22px; font-weight: 700; }
    .box-title { font-size: 21px; font-weight: 700; }
    .box-sub { font-size: 15px; fill: #475569; }
    .small { font-size: 14px; fill: #64748b; }
    .flow-label { font-size: 14px; fill: #334155; font-weight: 600; }
    .banner { font-size: 22px; font-weight: 700; fill: #ffffff; }
    .step { font-size: 15px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- title -->
  <text x="800" y="52" text-anchor="middle" class="title">制度エージェント システム構成</text>
  <text x="800" y="86" text-anchor="middle" class="subtitle">Gemini は聞き取りだけ。条文との照合・該当判定・金額計算は、すべて Prolog の論理推論。</text>

  <!-- ============ user / UI ============ -->
  <rect x="40" y="330" width="230" height="240" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="155" y="372" text-anchor="middle" class="box-title">ユーザー</text>
  <text x="155" y="398" text-anchor="middle" class="box-sub">チャットUI（ブラウザ）</text>
  <rect x="62" y="420" width="186" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="155" y="450" text-anchor="middle" class="box-sub" style="font-weight:700; fill:#0f172a">判定カード</text>
  <text x="155" y="474" text-anchor="middle" class="small">制度名・金額を表示する</text>
  <text x="155" y="494" text-anchor="middle" class="small">唯一のチャネル</text>
  <text x="155" y="522" text-anchor="middle" class="small">条文リンク / 推論ツリー付き</text>

  <!-- ============ Cloud Run outer ============ -->
  <rect x="330" y="130" width="900" height="640" rx="16" fill="#fbfdff" stroke="#64748b" stroke-width="2.5"/>
  <text x="358" y="168" class="zone-label">Google Cloud Run（単一コンテナ・ステートレス・DBなし）</text>
  <text x="358" y="194" class="small">FastAPI — facts・自由文入力はログにも残さない（プライバシー設計）</text>

  <!-- Gemini zone -->
  <rect x="360" y="220" width="840" height="220" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="384" y="256" class="zone-label" style="fill:#1d4ed8">Gemini Flash（聞き取り・対話のみ — 条文との照合・判定は行わない）</text>

  <rect x="390" y="280" width="370" height="130" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <rect x="390" y="280" width="52" height="30" rx="8" fill="#2563eb"/>
  <text x="416" y="301" text-anchor="middle" class="step">①</text>
  <text x="458" y="303" class="box-title" style="font-size:18px">事実抽出</text>
  <text x="406" y="336" class="box-sub">「去年離婚してひとり親です」</text>
  <text x="406" y="360" class="box-sub">→ hitorioya: true（構造化出力）</text>
  <text x="406" y="388" class="small">ホワイトリスト検証・null-onlyマージで隔離</text>

  <rect x="800" y="280" width="370" height="130" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <rect x="800" y="280" width="52" height="30" rx="8" fill="#2563eb"/>
  <text x="826" y="301" text-anchor="middle" class="step">④</text>
  <text x="868" y="303" class="box-title" style="font-size:18px">応答生成（理解の確認のみ）</text>
  <text x="816" y="336" class="box-sub">「受給見込みが6件→10件に増えました」</text>
  <text x="816" y="360" class="box-sub">件数変化は機械計算値のみ</text>
  <text x="816" y="388" class="small">制度名・金額は入力からも遮断＝書けない</text>

  <!-- Prolog zone -->
  <rect x="360" y="490" width="840" height="250" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="384" y="518" class="zone-label" style="fill:#047857">決定的パイプライン</text>
  <text x="384" y="540" class="small" style="fill:#059669; font-weight:600">LLM不使用・判定コスト0円</text>

  <rect x="390" y="550" width="330" height="160" rx="10" fill="#ffffff" stroke="#6ee7b7" stroke-width="2"/>
  <rect x="390" y="550" width="52" height="30" rx="8" fill="#059669"/>
  <text x="416" y="571" text-anchor="middle" class="step">②</text>
  <text x="458" y="573" class="box-title" style="font-size:18px">factgen</text>
  <text x="406" y="606" class="box-sub">facts JSON → Prolog 事実</text>
  <text x="406" y="630" class="box-sub">唯一の Prolog 生成ゲートウェイ</text>
  <text x="406" y="658" class="small">ユーザー文字列は Prolog に到達しない</text>
  <text x="406" y="680" class="small">不正な facts は 422 で拒否</text>

  <rect x="800" y="550" width="370" height="160" rx="10" fill="#ffffff" stroke="#6ee7b7" stroke-width="2"/>
  <rect x="800" y="550" width="52" height="30" rx="8" fill="#059669"/>
  <text x="826" y="571" text-anchor="middle" class="step">③</text>
  <text x="868" y="573" class="box-title" style="font-size:18px">SWI-Prolog 判定エンジン</text>
  <text x="816" y="606" class="box-sub">条文由来ルール × facts を論理照合（220制度・約50ms）</text>
  <text x="816" y="630" class="box-sub">該当判定・金額計算・証明木・不足事実の特定</text>
  <text x="816" y="658" class="small">decided / blocked / ineligible の3値判定</text>
  <text x="816" y="680" class="small">「次に聞くべき質問」も機械的に導出</text>

  <!-- ============ rules ============ -->
  <rect x="1290" y="490" width="270" height="250" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="1425" y="528" text-anchor="middle" class="box-title" style="font-size:19px">ルールベース rules/*.pl</text>
  <text x="1425" y="560" text-anchor="middle" class="box-sub">国 / 東京都 / 23区 の2層構造</text>
  <text x="1425" y="584" text-anchor="middle" class="box-sub">1制度 = 1モジュール</text>
  <line x1="1315" y1="604" x2="1535" y2="604" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="1425" y="632" text-anchor="middle" class="box-sub" style="font-weight:700; fill:#92400e">golden テスト 818件</text>
  <text x="1425" y="658" text-anchor="middle" class="small">条文から導出した期待値と</text>
  <text x="1425" y="678" text-anchor="middle" class="small">全ケース照合（CI で常時検証）</text>
  <text x="1425" y="706" text-anchor="middle" class="small">条文の形式化は Gemini ＋ 人間レビュー</text>

  <!-- Secret Manager -->
  <rect x="1290" y="330" width="270" height="110" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="1425" y="368" text-anchor="middle" class="box-title" style="font-size:18px">Secret Manager</text>
  <text x="1425" y="396" text-anchor="middle" class="box-sub">Gemini API キーを実行時注入</text>
  <text x="1425" y="420" text-anchor="middle" class="small">イメージ・リポジトリにキーは存在しない</text>

  <!-- ============ arrows ============ -->
  <!-- user -> step1: straight into the left edge of box 1 -->
  <path d="M270,345 L385,345" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="312" y="334" class="flow-label">自由な発話</text>

  <!-- step1 -> factgen -->
  <path d="M650,410 L650,545" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="665" y="475" class="flow-label" style="fill:#1d4ed8">検証済み facts</text>

  <!-- factgen -> prolog -->
  <path d="M720,630 L795,630" fill="none" stroke="#047857" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

  <!-- rules -> prolog -->
  <path d="M1290,630 L1175,630" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- prolog -> step4 -->
  <path d="M985,545 L985,415" fill="none" stroke="#047857" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="1000" y="475" class="flow-label" style="fill:#047857">件数変化のみ</text>

  <!-- prolog -> card: below the Prolog zone, around the outside -->
  <path d="M985,710 L985,757 L310,757 L310,480 L275,480" fill="none" stroke="#047857" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="430" y="752" class="flow-label" style="fill:#047857">判定結果（制度名・金額・証明木）はカードへ直行</text>

  <!-- step4 -> user: over the top of the Gemini zone -->
  <path d="M985,280 L985,207 L300,207 L300,390 L275,390" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="1010" y="240" class="flow-label" style="fill:#1d4ed8">理解の確認（会話）</text>

  <!-- secret -> cloud run -->
  <path d="M1290,385 L1235,385" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>

  <!-- ============ bottom banner ============ -->
  <rect x="120" y="800" width="1360" height="60" rx="12" fill="#0f172a"/>
  <text x="800" y="838" text-anchor="middle" class="banner">条文とあなたの状況を照合・判定するのは Prolog のみ — 判定プロセスに LLM がいないから、ハルシネーションが発生しない</text>
</svg>
