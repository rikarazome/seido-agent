# ここに載るのは「対象年齢18歳年度末・所得制限なし・自己負担なし・健保加入要件」の
# 4点が区公式サイトで確認できた区のみ（品質ゲート: 盛らない）。
# shibuya は手動形式化済み（tests/golden/shibuya_kodomo_iryouhi/）のため対象外。
# 所得制限の「消極的確認」= 公式ページ・条例に所得要件の記載が一切ないことをもって
# 「なし」と形式化（渋谷区と同じ確認水準。note に明記）。

