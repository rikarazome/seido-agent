# 一問一答の静的メタデータ（docs/specs/architecture.md 一問一答エンジン）
# 設計規則:
#  (1) enum の choices は法定列挙のみ。「その他」(__free_text__) と「わからない/答えたくない」
#      (declined) はエンジンが全質問に自動付与する
#  (2) 式に入る数値fact（扶養人数等）は整数選択肢のみ・段階レンジ禁止
#  (3) 金額系レンジの最上段は番兵上限 [lo, 999999999]

- fact: hitorioya
  text: ひとり親世帯ですか
  type: boolean
  sensitive: true

- fact: hitorioya_jiyuu
  text: ひとり親となった理由を教えてください
  type: enum
  # 法4条1項の法定列挙（VERIFIED 2026-06-11、statute_source.md）。
  # UIにはprimaryの3択+「その他」を表示し、残りは「その他」→自由文分類で拾う
  choices: { rikon: 離婚, shibou: 死別, mikon: 未婚,
             shougai: 父または母の重度障害, seishi_fumei: 生死不明,
             iki: 1年以上の遺棄, koukin: 1年以上の拘禁, dv_hogo: DV保護命令 }
  primary: [rikon, shibou, mikon]
  sensitive: true

- fact: seikei_douitsu_partner
  text: 事実上の配偶者（同居のパートナー等）と生計を共にしていますか
  type: boolean
  sensitive: true

- fact: fuyou_ninzu
  text: 税法上の扶養親族は何人ですか
  type: integer
  choices: [0, 1, 2, 3, 4, 5]   # 6人以上は自由文へ

- fact: income
  askable_key: nenshu            # 回答の書き込み先（既定はfact名と同じ）
  text: 昨年の年収（額面・源泉徴収票の支払金額）はどのくらいですか
  type: range_choice             # 値は [lo, hi]。最上段は番兵上限規約
  choices:
    - { value: [0, 2000000], label: 200万円未満 }
    - { value: [2000000, 4000000], label: 200〜400万円 }
    - { value: [4000000, 6000000], label: 400〜600万円 }
    - { value: [6000000, 10000000], label: 600万〜1,000万円 }
    - { value: [10000000, 999999999], label: 1,000万円以上 }

- fact: kenkou_hoken
  text: ご家族は健康保険（国民健康保険・社会保険など）に加入していますか
  type: boolean

# --- per-child askables（children[].askable。質問文の {child} は「2009年生まれのお子さん」等に展開） ---

- fact: koukou_zaigaku
  scope: per_child
  text: "{child}は高校等（高等学校・高専・専修学校等）に在学していますか"
  type: boolean

- fact: gakkou_kubun
  scope: per_child
  text: "{child}の学校の区分を教えてください"
  type: enum
  choices: { kouritsu: 公立（全日制）, shiritsu: 私立（全日制） }
  # 高専・通信制は未対応（「その他」→自由文で案内のみ。statute_source参照）

- fact: income_exact
  askable_key: shotoku_exact
  # ハイブリッド方式（2026-06-11決定）: 年収レンジの概算変換が限度額を跨いだときだけ出る質問。
  # 回答は facts.askable.shotoku_exact に書く（nenshuに書き戻さない — 回答は控除後所得であり年収ではない。
  # factgenが shotoku_exact 優先で known(income(P), 点値) を生成する）
  text: 源泉徴収票の「給与所得控除後の金額」を教えてください（受け取っている養育費があれば年額も）
  type: integer_input             # チップではなく数値入力欄（+「わからない」）
  sensitive: true
