[pytest]
# verify_sources fetches every source_url live (slow, network, ward-CMS
# availability varies) -- opt in explicitly per the test's own docstring:
#   python -m pytest -m verify_sources
# The CLI -m flag overrides this addopts default when given.
addopts = -m "not verify_sources"
markers =
    verify_sources: fetch source_url and verify source_quote on the live page (network required)
